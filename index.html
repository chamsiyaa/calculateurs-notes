<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculateur de notes</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <h1>Calculateur de notes</h1>
    <p>
      Ajoute les évaluations d’un même cours pour suivre ta moyenne.
      La note finale apparaît lorsque les poids totalisent 100 %.
    </p>

    <form id="formulaire">
      <label for="nom">Nom de l’évaluation</label>
      <input id="nom" type="text" placeholder="Ex. : Projet 1" required>

      <label for="note">Note sur 100</label>
      <input id="note" type="number" min="0" max="100"
             step="0.01" placeholder="Ex. : 80" required>

      <label for="poids">Poids dans le cours (%)</label>
      <input id="poids" type="number" min="0.01" max="100"
             step="0.01" placeholder="Ex. : 40" required>

      <button type="submit">Ajouter l’évaluation</button>
    </form>

    <p id="erreur" role="alert"></p>

    <h2>Mes évaluations</h2>
    <ul id="evaluations"></ul>

    <h2>Mon résultat</h2>
    <p id="resultat" aria-live="polite">
      Ajoute une évaluation pour voir ta moyenne.
    </p>
  </main>
</body>
</html>
